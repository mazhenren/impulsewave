# Hexo Configuration
title: 股票期货外汇技术分析笔记
subtitle: 交易系统 · 复盘记录 · 风险管理
description: 股票、期货、外汇的技术分析与交易复盘笔记
keywords: 技术分析,股票,期货,外汇,交易系统,交易复盘,风险管理
author: 股票期货外汇技术分析笔记
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://mazhenren.github.io/impulsewave
root: /impulsewave/
permalink: posts/:abbrlink/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# 永久链接短码（hexo-abbrlink）
abbrlink:
  alg: crc32
  rep: hex
  drafts: false

# 正文外链加 nofollow（hexo-filter-nofollow）
nofollow:
  enable: true
  field: post
  exclude:
    - mazhenren.github.io

# 站点地图（hexo-generator-sitemap）
sitemap:
  path: sitemap.xml
  tags: false
  categories: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Markdown 渲染：自动为 / 开头的图片路径补上 root 前缀
marked:
  prependRoot: true
  postAsset: true

# Local search（NexT 本地搜索数据源，hexo-generator-searchdb）
search:
  path: search.xml
  field: post
  content: true
  format: html
  limit: 10000

# RSS
feed:
  type: atom
  path: atom.xml
  limit: 20

# Extensions
theme: next
