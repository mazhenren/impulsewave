# Stellar 主题配置（站点根 _config.stellar.yml，覆盖主题默认配置）
# 主题默认配置见 node_modules/hexo-theme-stellar/_config.yml

# 源站地址：用于生成每页 canonical
canonical:
  originalHost: mazhenren.github.io

open_graph:
  enable: true

structured_data:
  links:
    - https://github.com/mazhenren

######## 侧栏顶部 ########
logo:
  avatar: '[https://mazhenren.github.io/impulsewave/images/avatar.jpg](/about/)'
  title: '[{config.title}](/)'
  subtitle: '{config.subtitle}'

# 主导航（左侧竖排）：星球动态为主页 /，文章列表在 /posts/
menubar:
  items:
    - id: planet
      theme: '#FA6400'
      icon: example:planet
      title: 星球动态
      url: /
    - id: post
      theme: '#1BCDFC'
      icon: default:documents
      title: 博客
      url: /posts/
    - id: categories
      theme: '#3DC550'
      icon: default:category
      title: 分类
      url: /categories/
    - id: tags
      theme: '#8A2BE2'
      icon: default:hashtag
      title: 标签
      url: /tags/
    - id: archives
      theme: '#F44336'
      icon: default:calendar
      title: 归档
      url: /archives/
    - id: about
      theme: '#00B8D4'
      icon: default:shield-user
      title: 关于
      url: /about/

######## 页面结构 ########
site_tree:
  home:
    leftbar: author_card, recent, visitor
  index_blog:
    menu_id: post
    leftbar: author_card, recent
  post:
    menu_id: post
    leftbar: author_card, recent, planet_tip
    rightbar: toc
  page:
    leftbar: author_card, recent
  error_page:
    '404': '/404.html'
    leftbar: author_card, recent

######## 左栏组件 ########
# widgets 与 authors 定义在 source/_data/widgets.yml、source/_data/authors.yml（Stellar 从站点数据文件读取）

######## 文章 ########
article:
  # 置顶：首页平铺展示（不用轮播）
  pin_style: flat
  type: tech
  cover_ratio: 2
  card_style: classic
  banner_ratio: 2.5
  # 字数与预计阅读时长（原生支持）
  reading_time: true
  card_tags: false
  tags: true
  # 版权声明（文章页底部，{author.name}/{author.url} 自动替换）
  license: '本文由 [{author.name}]({author.url}) 原创，采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
  share:
    - link

######## 搜索 ########
search:
  service: local_search
  local_search:
    field: all
    path: /search.json
    content: true
    lazy_load: true

######## 评论 ########
comments:
  service: utterances
  comment_title: 快来参与讨论吧~
  utterances:
    repo: mazhenren/impulsewave
    issue-term: pathname
    theme: preferred-color-scheme

######## 页脚 ########
footer:
  content: |
    本站由 [{author.name}](/about/) 使用 [{theme.name} {theme.version}]({theme.tree}) 主题创建。

    本站为个人研究与交易记录，不构成任何投资建议。本博客所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。

######## 注入 ########
inject:
  head:
    - '<script defer src="/impulsewave/js/planet-badge.js"></script>'
    - '<script defer src="/impulsewave/js/planet-enhance.js"></script>'
    - '<link rel="stylesheet" href="/impulsewave/css/planet.css">'
