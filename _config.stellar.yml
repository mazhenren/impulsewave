# Stellar v2 站点配置（覆盖 node_modules/hexo-theme-stellar/_config.yml 的默认值）
# 字段参考：https://xaoxuu.com/wiki/stellar/reference/theme/
# 迁移对照：https://xaoxuu.com/wiki/stellar/migration/fields/

######## SEO ########
canonical:
  # 正式域名（GitHub Pages 项目站）；用于生成每页 canonical
  host: mazhenren.github.io
  allowed_hosts:
    - localhost

open_graph:
  enabled: true

structured_data:
  same_as:
    - https://github.com/mazhenren

######## 左栏 Brand 与菜单 ########
leftbar:
  brand:
    # 头像（项目站：主题直接输出 src，需带 /impulsewave/ 前缀）
    image:
      src: /impulsewave/images/avatar.jpg
      variant: avatar
    name: '{config.title}'
    tagline: '{config.subtitle}'
    href: /
    # Brand 区搜索按钮（需要 search.provider）
    search: true
  # 左栏固定底部：社交按钮区（关注 / 订阅 / 导航 / 联系）
  footer:
    actions:
      - type: link
        title: Follow me on GitHub
        url: https://github.com/mazhenren
        icon: github:logo
      - type: link
        title: RSS 订阅
        url: /atom.xml
        icon: default:rss
      - type: link
        title: 站点地图
        url: /sitemap.xml
        icon: default:platforms
      - type: link
        title: 邮箱联系
        url: mailto:ihuige@gmail.com
        icon: share:email
  # 一级导航：星球（首页 /）与专栏（/posts/）分列两个入口
  menu:
    - id: planet
      title: 星球
      icon: example:planet
      accent: '#FA6400'
      url: /
    - id: post
      title: 专栏
      icon: default:documents
      accent: '#1BCDFC'
      url: /posts/
    - id: categories
      title: 分类
      icon: default:category
      accent: '#3DC550'
      url: /categories/
    - id: tags
      title: 标签
      icon: default:hashtag
      accent: '#8A2BE2'
      url: /tags/
    - id: archives
      title: 归档
      icon: default:calendar
      accent: '#F44336'
      url: /archives/
    - id: about
      title: 关于
      icon: default:shield-user
      accent: '#00B8D4'
      url: /about/

######## 各类型页面的 Region 与导航 ########
# 组件目录见 source/_data/widgets.yml（v2 从站点数据文件合并进 runtime widgets）
profiles:
  home:
    active_menu: planet
    leftbar:
      widgets:
        - author_card
        - recent
        - planet_tip
        - visitor
    rightbar:
      widgets:
        - welcome
  blog_index:
    active_menu: post
    leftbar:
      widgets:
        - author_card
        - recent
    rightbar:
      widgets:
        - welcome
  post:
    active_menu: post
    leftbar:
      widgets:
        - author_card
        - recent
        - planet_tip
    rightbar:
      widgets:
        - toc
  page:
    active_menu: planet
    leftbar:
      widgets:
        - author_card
        - recent
  error:
    active_menu: planet
    image: null
    leftbar:
      widgets:
        - author_card
        - recent
  # 设置页「关于」条目：条目名改成站点自己的叫法
  settings:
    about:
      items:
        - key: 专栏框架
          value: Hexo {hexo.version}
          url: https://hexo.io/
        - key: 主题版本
          value: Stellar {theme.version}
          url: '{theme.tree}'

######## 文章 ########
article:
  style: tech
  banner:
    # 有封面才显示横幅背景，星球帖无封面时保持纯色
    background: true
  listing:
    # 置顶平铺展示，不用轮播
    pinned_layout: flat
    card_layout: classic
    cover_ratio: 2
    show_tags: false
  # 分类配色（星球帖的话题分类）
  category_colors:
    股票: '#0E8A16'
    期货: '#1D76DB'
    外汇: '#006B75'
    技术分析: '#B60205'
    交易笔记: '#2E7D32'
  show_reading_time: true
  # 关闭「相关文章」：未安装 hexo-related-popular-posts，且 0 表示不显示
  related_posts_limit: 0
  footer:
    license: '本文由 [{author.name}]({author.url}) 原创，采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
    # v2 分享服务改为 qrcode/weibo/x/telegram/whatsapp/email
    # email 会生成 mailto: 分享链接，不需要在站点里配置邮箱地址
    share:
      - qrcode
      - email

######## 搜索 ########
search:
  provider: local
  local:
    scope: all
    include_content: true
    cache_ttl_seconds: 86400

######## 评论 ########
comments:
  provider: utterances
  title: 快来参与讨论吧~
  utterances:
    repo: mazhenren/impulsewave
    issue-term: pathname
    theme: preferred-color-scheme

######## 页脚 ########
footer:
  content: |
    本站由 [{author.name}](/about/) 使用 [{theme.name} {theme.version}]({theme.tree}) 主题创建。

    本站为个人研究与交易记录，不构成任何投资建议。本站所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。

######## 注入 ########
# v2 只有 head_begin/head_end/body_begin/body_end，字符串形式（不再是数组）
inject:
  head_begin: |
    <script defer src="/impulsewave/js/planet-badge.js"></script>
    <script defer src="/impulsewave/js/planet-feed.js?v=8"></script>
    <link rel="stylesheet" href="/impulsewave/css/planet.css?v=9">
    <link rel="stylesheet" href="/impulsewave/css/site.css?v=1">
