name: "🪐 星球发帖"
description: 发布一条星球内容，1~3 分钟内自动同步为站点文章
labels: [planet]
body:
  - type: markdown
    attributes:
      value: |
        提交后由 GitHub Actions 自动同步上线。精华/置顶可通过在 Issue 右侧添加 `featured` / `pin` 标签实现，改动后会自动重新同步。
  - type: textarea
    id: body
    attributes:
      label: 正文
      description: 支持 Markdown，可直接粘贴截图
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 分类
      options:
        - 股票
        - 期货
        - 外汇
        - 技术分析
        - 交易笔记
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: 标签
      description: 多个标签用逗号分隔，如：波浪理论, 趋势线
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 显示在信息流卡片上，留空则自动截取正文开头
  - type: input
    id: cover
    attributes:
      label: 封面图 URL
      description: 可选，卡片右侧缩略图
  - type: checkboxes
    id: pin
    attributes:
      label: 置顶
      options:
        - label: 置顶这条动态到信息流顶部
          required: false
