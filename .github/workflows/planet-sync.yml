name: Sync Planet Issues

on:
  issues:
    types: [opened, edited, deleted, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync issues to posts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/sync-planet.mjs

      - name: Commit changes
        id: commit
        run: |
          git config user.name "马真人"
          git config user.email "292309400+mazhenren@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无变更，跳过提交"
          else
            git commit -m "planet: 同步 Issue 内容（$GITHUB_EVENT_NAME）"
            git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 的提交不会触发 on:push 工作流，必须显式触发部署
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master -R ${{ github.repository }}
